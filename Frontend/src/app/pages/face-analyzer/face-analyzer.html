<div class="analyzer-container">
  <div class="mb-4">
    <h2 class="fw-bold text-white mb-1">Face Analyzer</h2>
    <p class="text-secondary small">Real-time Face Recognition that determine your age, gender, and mood</p>
    <div class="d-flex justify-content-center w-100">
      <button mat-raised-button [color]="isCameraOn ? 'warn' : 'primary'" (click)="toggleCamera()"
        class="mt-2 px-4 rounded-pill">
        {{ isCameraOn ? 'Turn Off Camera' : 'Start Recognition' }}
      </button>
    </div>
  </div>
  <br>
<div class="analysis-layout">
  <div class="video-frame-card" [class.d-none]="!isCameraOn">
    <div class="canvas-stack">
      <video #videoPlayer autoplay muted></video>
      <canvas #overlayCanvas></canvas>
    </div>
  </div>

  <!-- Behavior stat -->
  <div class="stats-bar" *ngIf="isCameraOn" [@fadeIn]>
    <ng-container *ngIf="stats; else loadingStats">
      Age: <span class="stat-value">{{ stats.age }}</span>
      Gender: <span class="stat-value">{{ stats.gender | titlecase }}</span>
      Mood:
      <span class="stat-value mood" [ngClass]="stats.mood.toLowerCase()">
        {{ stats.mood | titlecase }}
      </span>
    </ng-container>

    <ng-template #loadingStats>
      Age: <span class="stat-value">Loading...</span>
      Gender: <span class="stat-value">Loading...</span>
      Mood: <span class="stat-value">Loading...</span>
    </ng-template>
  </div>

  <!-- Object stat -->
  <div class="stats-bar" *ngIf="isCameraOn">
    <ng-container *ngIf="detectedObjects.length > 0; else loadingObjects">
      <div *ngFor="let obj of detectedObjects" class="object-tag">
        <span class="stat-label">{{ obj.class }}</span>
        <span class="stat-value">{{ obj.score }}%</span>
      </div>
    </ng-container>

    <ng-template #loadingObjects>
      <div class="object-tag">
        <span class="stat-label">Loading...</span>
      </div>
    </ng-template>
  </div>
</div>
</div>
